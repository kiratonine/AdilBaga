name: Deploy production Go API
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, deploy]
        default: dry-run
      sha:
        description: Exact main SHA (deploy only)
        required: false
        type: string
      ci_run:
        description: Successful push-main CI run ID (deploy only)
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: adilbaga-production-api
  cancel-in-progress: false
jobs:
  offline:
    name: Deployment offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.10.0', package-manager-cache: false}
      - run: node --test scripts/deploy/auto-gate.test.mjs
      - run: python3 -m unittest discover -s scripts/deploy -p 'auto_*_test.py'
      - run: node scripts/deploy/verify-auto-deploy.mjs
      - run: node --test scripts/deploy/verify-part15.test.mjs
      - run: node scripts/deploy/verify-part15.mjs
  gate:
    needs: offline
    # Only repository variables, not environment vars, may enable this first gate.
    if: >-
      vars.AUTO_DEPLOY_ENABLED == 'true' && github.repository == 'kiratonine/AdilBaga' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == 'kiratonine/AdilBaga' &&
        github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'deploy'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
      sha: ${{ steps.gate.outputs.sha }}
      ci_id: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: main, persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.10.0', package-manager-cache: false}
      - id: gate
        env:
          AUTO_DEPLOY_ENABLED: ${{ vars.AUTO_DEPLOY_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/auto-gate.mjs
  rollout:
    needs: gate
    if: needs.gate.outputs.eligible == 'true'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.10.0', package-manager-cache: false}
      - name: Read-only release plan before build
        id: plan
        env:
          DEPLOY_PHASE: plan
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          CI_RUN: ${{ needs.gate.outputs.ci_id }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: node scripts/deploy/auto-transport.mjs
      - name: Recheck candidate and build outside VPS
        if: steps.plan.outputs.changed == 'true'
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          CI_RUN: ${{ needs.gate.outputs.ci_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deploy/auto-build.mjs
      - name: Approved broker transport and bounded rollout
        if: steps.plan.outputs.changed == 'true'
        env:
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
          CI_RUN: ${{ needs.gate.outputs.ci_id }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: node scripts/deploy/auto-transport.mjs
