version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend-go
    target-branch: integrate/full-stack
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /backend
    target-branch: integrate/full-stack
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    target-branch: integrate/full-stack
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /contracts
    target-branch: integrate/full-stack
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    target-branch: integrate/full-stack
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
